<!-- Urgent filter button for planning_pending_list.html -->
<form method="get" class="ml-2">
  <button type="submit" name="urgent" value="1" class="px-4 py-2 rounded-lg bg-red-500 hover:bg-red-600 text-white font-semibold shadow transition">
    Urgent Ones
  </button>
  {% if request.GET.urgent %}
    <a href="?" class="ml-2 px-4 py-2 rounded-lg bg-gray-300 hover:bg-gray-400 text-gray-800 font-semibold shadow transition">Show All</a>
  {% endif %}
</form>
