<!DOCTYPE html>
<html lang="en">
{% load static %}
<head>
    <meta charset="UTF-8">
    <title>Vinayaka Seals - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* subtle slow pulse for ring */
        @keyframes pulse-slow {
            0%{ transform: scale(1); opacity: 0.8 }
            50%{ transform: scale(1.08); opacity: 0.95 }
            100%{ transform: scale(1); opacity: 0.8 }
        }
        .animate-pulse-slow{ animation: pulse-slow 1.6s infinite ease-in-out }

        /* animated gradient background for overlay */
        @keyframes gradientShift {
            0% { background-position: 0% 50% }
            50% { background-position: 100% 50% }
            100% { background-position: 0% 50% }
        }
        .animate-gradient-bg{
            background-size: 300% 300%;
            animation: gradientShift 6s ease infinite;
        }
    </style>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f6fa;
        }

        .container-main {
            display: flex;
            width: 900px;
            height: 550px;
            background: #fff;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        /* Left Section with Image */
        .left-side {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
            padding: 30px;
            background: #000;
        }

        .left-side h2 {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .left-side p {
            font-size: 1rem;
        }

        /* Right Side - Form */
        .right-side {
            flex: 1;
            background: #fff;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .company-name {
            font-size: 1.3rem;
            font-weight: bold;
            color: #0d47a1;
            margin-bottom: 1rem;
            text-align: center;
        }

        .right-side h2 {
            margin-bottom: 1.5rem;
            font-weight: bold;
            color: #1976d2;
            text-align: center;
        }

        .form-label {
            font-weight: 500;
            color: #333;
        }

        .form-control {
            border-radius: 8px;
            padding: 10px;
        }

        .btn-primary {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            font-weight: 600;
            background: #1976d2;
            border: none;
        }

        .btn-primary:hover {
            background: #1565c0;
        }

        .messages {
            margin-top: 1rem;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.9rem;
            list-style: none;
        }
    </style>
</head>
<body>
    <!-- Enhanced animated overlay shown on form submit -->
    <div id="submitOverlay" class="fixed inset-0 z-50 hidden items-center justify-center">
        <div class="absolute inset-0 bg-gradient-to-r from-sky-400 via-indigo-500 to-purple-600 opacity-95 animate-gradient-bg"></div>
        <div class="relative z-10 w-full max-w-md mx-auto p-6 bg-white/10 backdrop-blur-md rounded-xl shadow-lg border border-white/10">
            <div class="flex flex-col items-center gap-4">
                <div class="relative">
                    <!-- animated ring -->
                    <div class="h-20 w-20 rounded-full bg-white/10 flex items-center justify-center">
                        <div class="ring-4 ring-white/30 rounded-full p-1 animate-pulse-slow"></div>
                        <img src="{% static 'app/backlogo.png' %}" alt="Logo" class="absolute h-12 w-12 rounded-full object-cover" />
                    </div>
                </div>
                <div class="text-center">
                    <div class="text-white text-xl font-semibold">Signing you in</div>
                    <div class="text-white/80 text-sm">Preparing your workspace…</div>
                </div>

                <div class="w-full mt-2">
                    <div class="h-2 bg-white/20 rounded-full overflow-hidden">
                        <div id="progressBar" class="h-2 bg-white rounded-full w-0 transition-all duration-700 ease-out"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="mainCard" class="container-main">
        <!-- Left Side -->
        <div class="left-side">
            <div style="margin-bottom: 30px;">
                <h2>Welcome Back!</h2>
                <p>Login to manage your inventory system<br>and streamline your workflow.</p>
            </div>
            <img src="{% static 'app/blanklogo.png' %}" alt="Logo" style="max-width: 350px; max-height: 320px; margin-bottom: 0;" />
        </div>

        <!-- Right Side -->
        <div class="right-side">
                <div style="display: flex; flex-direction: column; align-items: center; margin-bottom: 10px; margin-top: -30px;">
                    <img src="{% static 'app/logo.jpg' %}" alt="Logo" style="max-width: 100px; max-height: 100px; margin-bottom: 10px;" />
                </div>
                <div class="company-name">Vinayaka Seals</div>
            <h2>Login</h2>

            <!-- Login Form -->
            <form id="loginForm" method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>

                <button type="submit" class="btn btn-primary">Login</button>
            </form>

            <script>
                (function(){
                    const form = document.getElementById('loginForm');
                    const overlay = document.getElementById('submitOverlay');
                    const progressBar = document.getElementById('progressBar');
                    const mainCard = document.getElementById('mainCard');
                    if(!form) return;

                    form.addEventListener('submit', function(e){
                        // show overlay
                        overlay.classList.remove('hidden');
                        overlay.classList.add('flex');

                        // animate card to slightly lift and dim
                        mainCard.style.transition = 'transform 420ms cubic-bezier(.2,.9,.2,1), opacity 420ms ease';
                        mainCard.style.transform = 'translateY(-12px) scale(0.985)';
                        mainCard.style.opacity = '0.55';

                        // animate progress bar to 100% over 740ms
                        requestAnimationFrame(() => {
                            progressBar.style.width = '100%';
                        });

                        // wait for the animation to show, then submit
                        setTimeout(function(){
                            form.submit();
                        }, 740);

                        // prevent immediate default to allow animation
                        e.preventDefault();
                    });
                })();
            </script>

            {% if messages %}
                {% for message in messages %}
                    <div class="mb-3 {% if message.tags == 'success' %}alert alert-success{% elif message.tags == 'error' %}alert alert-danger{% else %}alert alert-info{% endif %}" role="alert">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        </div>
    </div>
</body>
</html>
