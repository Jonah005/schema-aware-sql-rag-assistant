<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Company Chatbot</title>
  <style>
    :root {
      --bg: #0b1220;
      --panel: #0f1a2f;
      --border: rgba(255,255,255,0.12);
      --text: rgba(255,255,255,0.92);
      --muted: rgba(255,255,255,0.65);
      --user: #1f6feb;
      --bot: #22c55e;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: radial-gradient(1200px 600px at 20% 0%, #162a55 0%, var(--bg) 50%) fixed;
      color: var(--text);
    }
    .wrap {
      max-width: 980px;
      margin: 0 auto;
      padding: 18px;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      background: rgba(15, 26, 47, 0.75);
      border: 1px solid var(--border);
      border-radius: 14px;
      backdrop-filter: blur(10px);
    }
    header h1 {
      font-size: 16px;
      margin: 0;
      letter-spacing: 0.3px;
    }
    header .hint {
      font-size: 12px;
      color: var(--muted);
    }

    .chat {
      margin-top: 14px;
      flex: 1;
      overflow: auto;
      padding: 14px;
      background: rgba(15, 26, 47, 0.65);
      border: 1px solid var(--border);
      border-radius: 14px;
      backdrop-filter: blur(10px);
    }

    .msg {
      display: flex;
      gap: 10px;
      margin: 10px 0;
      align-items: flex-start;
    }
    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 12px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.06);
      color: var(--muted);
      flex: 0 0 auto;
    }
    .bubble {
      max-width: 78%;
      padding: 10px 12px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.06);
      white-space: pre-wrap;
      line-height: 1.35;
      font-size: 14px;
    }
    .meta {
      margin-top: 4px;
      font-size: 11px;
      color: var(--muted);
    }

    .msg.user { flex-direction: row-reverse; }
    .msg.user .avatar { color: rgba(255,255,255,0.9); background: rgba(31,111,235,0.15); }
    .msg.user .bubble { background: rgba(31,111,235,0.15); }
    .msg.bot .avatar { color: rgba(255,255,255,0.9); background: rgba(34,197,94,0.15); }
    .msg.bot .bubble { background: rgba(34,197,94,0.12); }

    .composer {
      margin-top: 14px;
      padding: 12px;
      background: rgba(15, 26, 47, 0.75);
      border: 1px solid var(--border);
      border-radius: 14px;
      display: flex;
      gap: 10px;
      align-items: flex-end;
      backdrop-filter: blur(10px);
    }
    textarea {
      width: 100%;
      min-height: 46px;
      max-height: 160px;
      resize: none;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      outline: none;
      background: rgba(255,255,255,0.06);
      color: var(--text);
      font-size: 14px;
      line-height: 1.35;
    }
    button {
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.08);
      color: var(--text);
      cursor: pointer;
      font-weight: 600;
    }
    button:disabled {
      cursor: not-allowed;
      opacity: 0.65;
    }
    .status {
      margin-top: 8px;
      font-size: 12px;
      color: var(--muted);
      min-height: 16px;
    }
    .status.error { color: var(--danger); }
    .kbd {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.06);
      color: var(--muted);
      margin-left: 6px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>Company Chatbot</h1>
        <div class="hint">
          Ask about POs, job cards, stock, urgent planning, etc.
          <span class="kbd">Enter</span> send
          <span class="kbd">Shift+Enter</span> new line
        </div>
      </div>
      <div class="hint">
        Logged in as: <b>{{ request.user.username }}</b>
      </div>
    </header>

    <main id="chat" class="chat" aria-live="polite" aria-label="Chat messages">
      <div class="msg bot">
        <div class="avatar">BOT</div>
        <div>
          <div class="bubble">Hi! What do you want to check today?
Try: “Jobcard 12 status”, “Show urgent items”, “Stock of item code …”, “POs pending”.</div>
          <div class="meta" id="welcomeMeta"></div>
        </div>
      </div>
    </main>

    <form id="composer" class="composer" autocomplete="off">
      {% csrf_token %}
      <textarea id="input" placeholder="Type your message..." rows="1"></textarea>
      <button id="sendBtn" type="submit">Send</button>
    </form>

    <div id="status" class="status"></div>
  </div>

  <script>
    const chatEl = document.getElementById("chat");
    const formEl = document.getElementById("composer");
    const inputEl = document.getElementById("input");
    const sendBtn = document.getElementById("sendBtn");
    const statusEl = document.getElementById("status");
    const welcomeMeta = document.getElementById("welcomeMeta");

    // Use Django URL reversing (no hardcoding)
    const CHAT_API_URL = "{% url 'chat_api' %}";
    let conversationId = null;

    welcomeMeta.textContent = new Date().toLocaleString();

    function getCookie(name) {
      const value = `; ${document.cookie}`;
      const parts = value.split(`; ${name}=`);
      if (parts.length === 2) return parts.pop().split(";").shift();
      return "";
    }

    function getCSRFToken() {
      // Django default CSRF cookie name
      return getCookie("csrftoken");
    }

    function addMessage(role, text, meta = "") {
      const row = document.createElement("div");
      row.className = `msg ${role}`;

      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.textContent = role === "user" ? "YOU" : "BOT";

      const bubbleWrap = document.createElement("div");

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;

      const metaEl = document.createElement("div");
      metaEl.className = "meta";
      metaEl.textContent = meta || new Date().toLocaleString();

      bubbleWrap.appendChild(bubble);
      bubbleWrap.appendChild(metaEl);

      row.appendChild(avatar);
      row.appendChild(bubbleWrap);

      chatEl.appendChild(row);
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    function setStatus(text, isError = false) {
      statusEl.textContent = text || "";
      statusEl.classList.toggle("error", !!isError);
    }

    function autosize() {
      inputEl.style.height = "auto";
      inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + "px";
    }
    inputEl.addEventListener("input", autosize);

    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        formEl.requestSubmit();
      }
    });

    async function sendMessage(message) {
      setStatus("");
      sendBtn.disabled = true;

      try {
        const res = await fetch(CHAT_API_URL, {
          method: "POST",
          credentials: "same-origin", // sends session + csrftoken cookies
          headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": getCSRFToken(),
          },
          body: JSON.stringify({ message, conversation_id: conversationId }),
        });

        const ct = (res.headers.get("content-type") || "").toLowerCase();
        let data = null;
        let rawText = "";

        if (ct.includes("application/json")) {
          data = await res.json();
        } else {
          rawText = await res.text();
        }

        if (!res.ok) {
          const msg =
            (data && (data.reply || data.error)) ||
            (rawText ? rawText.slice(0, 300) : "") ||
            `HTTP ${res.status}`;
          throw new Error(msg);
        }

        conversationId = (data && data.conversation_id) ? data.conversation_id : conversationId;
        addMessage("bot", (data && data.reply) ? data.reply : "No reply.", new Date().toLocaleString());
      } catch (err) {
        console.error(err);
        setStatus(err.message || "Something went wrong.", true);
        addMessage("bot", `Error: ${err.message}`, new Date().toLocaleString());
      } finally {
        sendBtn.disabled = false;
      }
    }

    formEl.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = (inputEl.value || "").trim();
      if (!text) return;

      addMessage("user", text);
      inputEl.value = "";
      autosize();
      await sendMessage(text);
    });
  </script>
</body>
</html>
