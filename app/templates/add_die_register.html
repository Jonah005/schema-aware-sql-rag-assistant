<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add Die Register Entry</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Force all Django form inputs to look like Tailwind boxes */
    input, select, textarea {
      width: 100%;
      border: 1px solid #d1d5db; /* Tailwind's gray-300 */
      border-radius: 0.375rem; /* rounded-md */
      padding: 0.5rem 0.75rem; /* px-3 py-2 */
      background-color: white;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #3b82f6; /* Tailwind blue-500 */
      box-shadow: 0 0 0 3px rgba(59,130,246,0.3); /* blue ring */
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-blue-800 text-white shadow-md py-4">
    <div class="max-w-7xl mx-auto px-6 flex justify-between items-center">
      <h1 class="text-2xl font-semibold tracking-wide">Manufacturing Dashboard</h1>
      <button class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded-md text-sm font-medium">Logout</button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-grow flex justify-center items-start mt-12 px-6">
    <div class="w-full max-w-3xl bg-white shadow-xl rounded-2xl p-8 border border-gray-200">

      <!-- Title -->
      <div class="mb-8 border-b pb-4">
        <h2 class="text-3xl font-bold text-gray-800">Add Die Register Entry</h2>
        <p class="text-gray-500 text-sm mt-1">Fill in the die details below to add a new entry to the register.</p>
      </div>

      <!-- Success / Error Messages -->
      {% if messages %}
        <div class="mb-6">
          {% for message in messages %}
            <div class="text-green-700 bg-green-100 border border-green-300 rounded-md px-4 py-2 mb-2">
              {{ message }}
            </div>
          {% endfor %}
        </div>
      {% endif %}

      <!-- Form -->
      <form method="post" class="space-y-6">
        {% csrf_token %}

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          {% for field in form %}
            <div>
              <label for="{{ field.id_for_label }}" class="block text-gray-700 font-medium mb-1">
                {{ field.label }}
              </label>
              {{ field }}
            </div>
          {% endfor %}
        </div>

        <script>
          // Add a small client-side search/filter for the material select (id should be 'id_material')
          (function(){
            const sel = document.getElementById('id_material');
            if (!sel) return;
            // create a search input and insert before select
            const input = document.createElement('input');
            input.type = 'text';
            input.placeholder = 'Search material...';
            input.id = 'material_search';
            input.style.marginBottom = '6px';
            input.style.padding = '8px';
            input.style.width = '100%';
            sel.parentNode.insertBefore(input, sel);

            input.addEventListener('input', function(){
              const q = this.value.trim().toLowerCase();
              let firstVisible = null;
              for (let i=0;i<sel.options.length;i++){
                const o = sel.options[i];
                const txt = (o.text || '').toLowerCase();
                // use option.hidden which works across browsers for option visibility
                if (!q || txt.includes(q)) {
                  o.hidden = false;
                  if (!firstVisible) firstVisible = o;
                } else {
                  o.hidden = true;
                }
              }
              // if there is a visible option, select it for convenience
              if (firstVisible) {
                sel.value = firstVisible.value;
              }
            });
          })();
        </script>

        <div class="flex justify-end mt-8">
          <button type="submit"
            class="bg-blue-700 hover:bg-blue-800 text-white px-6 py-3 rounded-lg font-semibold shadow-md transition duration-300">
            Save Entry
          </button>
        </div>
      </form>
    </div>
  </main>
</body>
</html>
